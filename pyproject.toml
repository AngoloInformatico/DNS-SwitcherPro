[project]
name = "dns-switcher-pro"
version = "1.1.5"
description = "Desktop DNS switcher for TIM HUB and Pi-hole"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Alex Lignola" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "keyring>=25,<26",
  "cryptography>=44,<47",
  "pywebview>=5.3,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
