name: dns-switcher-pro

services:
  dns-switcher-pro:
    image: dns-switcher-pro:1.1.4-zimaos
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: dns-switcher-pro
    restart: unless-stopped
    init: true
    ipc: host
    ports:
      - target: 8765
        published: "${DNS_SWITCHER_PORT:-8765}"
        protocol: tcp
    environment:
      DNS_SWITCHER_CONTAINER: "1"
      DNS_SWITCHER_WORK_DIR: /data
      DNS_SWITCHER_ALLOWED_HOSTS: "*"
      DNS_SWITCHER_SESSION_TOKEN: "${DNS_SWITCHER_SESSION_TOKEN:?Impostare DNS_SWITCHER_SESSION_TOKEN nel file Docker/.env}"
      TZ: "${TZ:-Europe/Rome}"
    volumes:
      - type: bind
        source: "${DNS_SWITCHER_DATA_PATH:-/DATA/AppData/dns-switcher-pro}"
        target: /data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8765/api/health',headers={'X-Session-Token':os.environ['DNS_SWITCHER_SESSION_TOKEN']}); urllib.request.urlopen(r,timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

x-casaos:
  id: it.alexlignola.dnsswitcherpro
  main: dns-switcher-pro
  index: "/?token=${DNS_SWITCHER_SESSION_TOKEN}"
  port_map: "${DNS_SWITCHER_PORT:-8765}"
  scheme: http
  icon: "data:image/svg+xml;base64,"
  title:
    en_US: DNS Switcher Pro
    it_IT: DNS Switcher Pro
  tagline:
    en_US: Switch the router DNS between Pi-hole and standard mode
    it_IT: Cambia il DNS del router tra Pi-hole e modalità standard
  description:
    en_US: Local dashboard for controlling the IPv4 DNS configured on a TIM HUB router.
    it_IT: Dashboard locale per controllare il DNS IPv4 configurato sul router TIM HUB.
  author: Alex Lignola
  developer: Alex Lignola
  category: Network
  architectures:
    - amd64
  version: "1.1.4"
  update_at: "2026-08-16"
  tips:
    before_install:
      en_US: Configure Docker/.env before the first start. The container must reach the router and Pi-hole on the LAN.
      it_IT: Configurare Docker/.env prima del primo avvio. Il container deve raggiungere router e Pi-hole sulla LAN.
